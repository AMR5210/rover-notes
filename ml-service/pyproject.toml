[project]
name = "rover-ml-service"
version = "0.1.0"
description = "Embeddings, reranking, document parsing, and the eval harness"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    # What FastAPI reads a file upload with. In the parsing extra it made the whole
    # service fail to start without that extra: declaring an UploadFile endpoint needs
    # this package at import time, whatever the handler does. It is pure Python and
    # small, so the base install carries it and the heavy parsers stay optional.
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
# Week 3. Kept out of the service image — evals run in CI, not in the request path.
evals = [
    "ragas>=0.2",
    "pandas>=2.2",
    "numpy>=2.0",
    "psycopg[binary]>=3.2",
    "anthropic>=0.40",
]
# Weeks 9-10. Heavy parsing dependencies, split out so the base image stays small. The
# service starts without them and answers 501 on the upload paths, so a deployment that
# does not ingest files can skip the install rather than the endpoints failing obscurely.
parsing = [
    "pypdf>=5.1",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    # OCR for pages that carry no text layer. pytesseract is a thin wrapper: it shells
    # out to the tesseract binary, which is a system package and not installable from
    # here — see the parsing README for what a deployment needs. Absent, the parser
    # reports a page as unreadable rather than failing.
    "pytesseract>=0.3.13",
    "pillow>=11.0",
    # Readable text out of a web page. Boilerplate removal is the whole problem here:
    # a page's navigation, cookie banner and footer are text like any other, and
    # indexed alongside the article they answer questions with the site's chrome.
    "trafilatura>=2.2",
]

# Reranking by late interaction. Split out for the same reason as parsing: pylate brings
# torch and sentence-transformers, which dwarf the rest of this service, and a deployment
# reranking with the cross-encoder container needs none of it. Absent, `/rerank` still
# serves its default strategy and answers 501 for this one.
late-interaction = [
    "pylate>=1.6",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ml_service"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
# Pydantic generates model fields dynamically; its plugin teaches mypy the real types.
plugins = ["pydantic.mypy"]
# FastAPI's route decorators are untyped upstream. Flagging every handler for that adds
# noise without catching anything in our own code.
disallow_untyped_decorators = false

# The Anthropic SDK belongs to the `evals` extra, so the base environment CI type-checks
# in does not have it. The judge imports it inside the constructor that needs it, which
# is what lets the generation eval run against the CLI backend with the SDK absent.
[[tool.mypy.overrides]]
module = ["anthropic.*"]
ignore_missing_imports = true

# pylate, torch and numpy belong to the `late-interaction` extra, so the base environment
# CI type-checks in does not have them. They are imported inside the functions that use
# them, which is what lets the service start and serve its default reranker without the
# extra installed.
[[tool.mypy.overrides]]
module = ["pylate.*", "torch.*", "numpy.*"]
ignore_missing_imports = true

# pytesseract ships no type information. It is a thin wrapper over a subprocess call and
# the two functions used here are called through one narrow module, so the alternative —
# writing stubs for a dependency to describe a shell-out — buys nothing.
[[tool.mypy.overrides]]
module = ["pytesseract.*"]
ignore_missing_imports = true

# pdfplumber and trafilatura belong to the `parsing` extra, and neither ships type
# information. Both are imported inside the endpoints that need them, which is what lets
# the service start and answer 501 on those two paths when the extra is absent — the
# arrangement type-checking has to match, because the environment the gate and CI run in
# is the base one.
[[tool.mypy.overrides]]
module = ["pdfplumber.*", "trafilatura.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
# Test modules share PDF builders through tests/pdf_fixtures.py, imported as
# `tests.pdf_fixtures`. Naming the root here is what makes that package path resolve
# without turning tests/ into an installed package.
pythonpath = ["."]
testpaths = ["tests"]
